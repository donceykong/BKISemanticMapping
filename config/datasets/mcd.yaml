# MCD dataset config

/**:
  ros__parameters:
    # Map information
    resolution: 0.5
    # num_class = number of classes AND valid label index range [0, num_class-1]. Must be >= max_label_id + 1.
    # Semantic KITTI labels (0,1,10,11,...,99) -> use 100. MCD 0-21 -> use 22.
    num_class: 100

    # Sampling resolutions
    free_resolution: 200.0  # Free space sampling resolution
    ds_resolution: 0.5      # Downsampling factor

    # Information about range-finder data
    scan_num: 10000   # How many scans to use
    max_range: 200.0  # Sensor max range (m)
    skip_frames: 1   # Number of frames to skip between insertions (0 = process every frame, 1 = process every other frame, etc.)

    # Dataset information
    input_data_prefix: kth_day_09/lidar_bin/data
    input_label_prefix: kth_day_09/gt_labels
    lidar_pose_file: kth_day_09/pose_inW.csv
    gt_label_prefix: kth_day_09/gt_labels
    evaluation_result_prefix: evaluations/
    query: true
    visualize: true

    # Multiclass inference: read per-class confidence scores and take argmax
    use_multiclass: true
    multiclass_prefix: kth_day_09/inferred_labels/cenet_mcd/multiclass_confidence_scores
    label_config: labels_mcd.yaml

    # Visualization: show OSM priors colored (blend of building/road/grassland/tree). Use semantic for class colors.
    # Options: semantic, osm_building, osm_road, osm_grassland, osm_tree, osm_parking, osm_fence, osm_blend (all priors blended)
    color_mode: semantic
    # Color configuration (matters if color_mode is set to 'semantic)
    # Use semantickitti_colors when use_multiclass is true with semkitti labels,
    # or mcd_colors.yaml when using gt_labels directly.
    colors_file: mcd_colors.yaml

    # --------------------------------
    # OSM prior configuration 
    # --------------------------------
    # OSM prior decay: distance (m) over which prior drops from 1 to 0 away from OSM geometry
    osm_decay_meters: 3.0
    # OSM file for voxel priors (path relative to data dir, or absolute). Must match osm_visualizer if using both.
    osm_file: kth.osm
    osm_origin_lat: 59.347671416
    osm_origin_lon: 18.072069652
    # osm_origin_lat: 59.348268650
    # osm_origin_lon: 18.073204280

    # Tree points (natural=tree nodes): prior projected as 2D circles with this radius (meters). Same as osm_visualizer tree_point_radius_meters.
    osm_tree_point_radius_meters: 5.0