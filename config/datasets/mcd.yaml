# MCD dataset config

/**:
  ros__parameters:
    # Map information
    resolution: 0.25
    # Sampling resolutions
    free_resolution: 100.0  # Free space sampling resolution
    ds_resolution: 0.1      # Voxel DS size for pointcloud (before insertion)
    # num_class: number of common taxonomy classes (see labels_common.yaml).
    # All raw labels are mapped to [0, num_class-1] at ingestion time.
    num_class: 13

    # Information about range-finder data
    scan_num: 10000   # How many scans to use
    max_range: 200.0  # Sensor max range (m)
    skip_frames: 50   # Number of frames to skip between insertions (0 = process every frame, 1 = process every other frame, etc.)

    # Dataset information
    input_data_prefix: kth_day_09/lidar_bin/data
    lidar_pose_file: kth_day_09/pose_inW.csv
    input_label_prefix: kth_day_09/inferred_labels/cenet_mcd/multiclass_confidence_scores
    gt_label_prefix: kth_day_09/inferred_labels/cenet_mcd/multiclass_confidence_scores
    evaluation_result_prefix: prior_evaluations/
    query: true
    visualize: false

    # Multiclass inference: read per-class confidence scores and take argmax
    use_multiclass: true
    multiclass_prefix: kth_day_09/inferred_labels/cenet_mcd/multiclass_confidence_scores
    label_config: labels_semkitti.yaml

    inferred_labels_key: semkitti  # "mcd" or "semkitti" — selects *_to_common mapping from labels_common.yaml for inferred labels
    gt_labels_key: mcd        # "mcd" or "semkitti" — selects *_to_common mapping from labels_common.yaml for GT labels

    # Visualization: show OSM priors colored (blend of building/road/grassland/tree). Use semantic for class colors.
    # Options: semantic, osm_building, osm_road, osm_grassland, osm_tree, osm_parking, osm_fence, osm_blend (all priors blended)
    color_mode: semantic
    # Color configuration (matters if color_mode is set to 'semantic').
    # Uses common taxonomy colors from labels_common.yaml.
    colors_file: labels_common.yaml

    # --------------------------------
    # Uncertainty filtering configuration 
    # --------------------------------
    # Uncertainty filtering: build running confusion matrix from GT labels,
    # compute per-class precision, drop uncertain points for low-precision classes.
    use_uncertainty_filter: false
    # Filter mode: "confusion_matrix" (per-class precision threshold) or "top_percent" (drop top N% most uncertain)
    uncertainty_filter_mode: top_percent
    uncertainty_drop_percent: 100.0  # for top_percent mode: discount this % of most uncertain points per scan
    uncertainty_min_weight: 0.00     # minimum kernel weight for the most uncertain points (0.0 = no influence, 1.0 = no discounting)
    confusion_matrix_file: confusion_matrix_mcd.yaml  # for confusion_matrix mode

    # --------------------------------
    # OSM prior configuration 
    # --------------------------------
    # OSM prior decay: distance (m) over which prior drops from 1 to 0 away from OSM geometry
    osm_decay_meters: 1.0
    # OSM file for voxel priors (path relative to data dir, or absolute). Must match osm_visualizer if using both.
    osm_file: kth.osm
    osm_origin_lat: 59.347671416
    osm_origin_lon: 18.072069652

    # Tree points (natural=tree nodes): prior projected as 2D circles with this radius (meters). Same as osm_visualizer tree_point_radius_meters.
    osm_tree_point_radius_meters: 3.0 # m, 9.84 ft

    # OSM confusion matrix: semantic-OSM prior fusion.
    # Adds OSM-based bias to every BKI observation, maintaining constant influence.
    # Maps predicted semantic classes to OSM prior categories to bias predictions toward OSM-compatible classes.
    osm_confusion_matrix_file: osm_confusion_matrix.yaml
    osm_prior_strength: 0.0  # fraction of OSM influence per observation (0.0 = disabled)